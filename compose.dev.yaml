# Local con Podman: `podman-compose -f compose.dev.yaml up -d`.
# El frontend corre en el host (`cd frontend && bun dev`) y llega a la API por el proxy de Vite.
name: solarbell-dev

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: solarbell
      POSTGRES_USER: solarbell
      POSTGRES_PASSWORD: solarbell
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarbell -d solarbell"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && exec uvicorn app.principal:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://solarbell:solarbell@db:5432/solarbell
      TZ: ${TZ:-America/Bogota}
      CORS_ORIGINS: '["http://localhost:5173"]'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@solarbell.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-solarbell}
      DEVICE_API_KEY: ${DEVICE_API_KEY:-dev-device-key}
      RING_PAUSE_MS: ${RING_PAUSE_MS:-1000}
    volumes:
      - ./backend/app:/app/app:Z
      - ./backend/alembic:/app/alembic:Z
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata-dev:
