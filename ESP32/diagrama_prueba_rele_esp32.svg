<text x="275.0" y="178" text-anchor="middle" font-size="12" fill="#555">10 A · 12 V</text>
<text x="275.0" y="193" text-anchor="middle" font-size="12" fill="#555">con corte LVD</text>
<text x="206" y="124" text-anchor="start" font-size="11" fill="#111">BAT +</text>
<text x="206" y="164" text-anchor="start" font-size="11" fill="#111">BAT −</text>
<text x="344" y="124" text-anchor="end" font-size="11" fill="#111">LOAD +</text>
<text x="344" y="164" text-anchor="end" font-size="11" fill="#111">LOAD −</text>
<text x="275" y="226" text-anchor="middle" font-size="11" fill="#555">PV + / PV − → panel solar 30 Wp</text>
