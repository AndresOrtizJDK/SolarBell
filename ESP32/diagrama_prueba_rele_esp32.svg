<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 780" width="1340" height="780" font-family="Arial, Helvetica, sans-serif">
<rect width="1340" height="780" fill="#ffffff"/>
<text x="30" y="34" text-anchor="start" font-size="20" fill="#111" font-weight="700">SolarBell · Prueba: ESP32 + relé azul + interruptor de Wi-Fi (con LED)</text>
<text x="30" y="58" text-anchor="start" font-size="12" fill="#555">Batería → controlador → interruptor/fusible → LM2596 (5,0 V) → ESP32 + relé → LED. Las líneas que se cruzan sin punto NO están conectadas.</text>
