<text x="1262" y="580" text-anchor="start" font-size="11" fill="#111">LED</text>
<text x="1262" y="594" text-anchor="start" font-size="10" fill="#777">(pata larga</text>
<text x="1262" y="606" text-anchor="start" font-size="10" fill="#777">arriba)</text>
<path d="M930 500 H890 V565" fill="none" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
<text x="910" y="493" text-anchor="middle" font-size="10" fill="#d97706">GPIO27</text>
<rect x="870" y="565" width="40" height="28" rx="5" fill="#fff" stroke="#d97706" stroke-width="2"/>
<text x="890" y="583" text-anchor="middle" font-size="11" fill="#111">I / O</text>
<text x="866" y="575" text-anchor="end" font-size="11" fill="#111">Interruptor</text>
<text x="866" y="589" text-anchor="end" font-size="11" fill="#111">Wi-Fi</text>
<path d="M890 593 V700" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
<circle cx="890" cy="700" r="4.5" fill="#111827"/>
<rect x="30" y="250" width="620" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="100" y="644" width="22" height="5" fill="#dc2626"/>
<text x="128" y="650" text-anchor="start" font-size="12" fill="#111">12 V</text>
<rect x="172" y="644" width="22" height="5" fill="#ea580c"/>
<text x="200" y="650" text-anchor="start" font-size="12" fill="#111">5 V</text>
<rect x="244" y="644" width="22" height="5" fill="#111827"/>
<text x="272" y="650" text-anchor="start" font-size="12" fill="#111">GND</text>
<rect x="316" y="644" width="22" height="5" fill="#d97706"/>
<text x="344" y="650" text-anchor="start" font-size="12" fill="#111">GPIO27 (interruptor Wi-Fi)</text>
<rect x="520" y="644" width="22" height="5" fill="#16a34a"/>
<text x="548" y="650" text-anchor="start" font-size="12" fill="#111">GPIO26</text>
<text x="46" y="276" text-anchor="start" font-size="14" fill="#111" font-weight="700">Notas de conexión</text>
<text x="46" y="302" text-anchor="start" font-size="12" fill="#111">1. Ajusta el LM2596 a 5,0 V SIN carga (multímetro en OUT+/OUT−) antes de conectar el ESP32.</text>
<text x="46" y="324" text-anchor="start" font-size="12" fill="#111">2. Relé: VCC y GND a 5 V / GND. IN al GPIO26. Si el relé actúa al revés, descomenta</text>
<text x="46" y="346" text-anchor="start" font-size="12" fill="#111">    RELE_ACTIVO_EN_BAJO en configuracion.h. Firmware: descomenta  #define PIN_RELE 26.</text>
<text x="46" y="368" text-anchor="start" font-size="12" fill="#111">3. LED con 1 kΩ desde 5 V ≈ 3 mA (tenue pero visible). Con 330 Ω ≈ 9 mA.</text>
<text x="46" y="390" text-anchor="start" font-size="12" fill="#111">4. Todas las tierras unidas: batería, LM2596, ESP32, relé, LED e interruptor Wi-Fi.</text>
<text x="46" y="412" text-anchor="start" font-size="12" fill="#111">5. Sin reloj DS3231: la app pone la hora al conectarse y un corte de luz la borra.</text>
<text x="46" y="434" text-anchor="start" font-size="12" fill="#111">6. Sube el firmware por USB con la batería desconectada; nunca USB y VIN a la vez.</text>
<text x="46" y="456" text-anchor="start" font-size="12" fill="#111">7. Interruptor del Wi-Fi: entre GPIO27 y GND (2 terminales, sin 5 V ni 12 V).</text>
<text x="46" y="478" text-anchor="start" font-size="12" fill="#111">    Cerrado (I) = Wi-Fi apagado; abierto (O) o sin cable = encendido.</text>
<text x="46" y="500" text-anchor="start" font-size="12" fill="#111">8. El inversor y la campana NO van en este circuito.</text>
<text x="46" y="650" text-anchor="start" font-size="12" fill="#111" font-weight="700">Colores:</text>
</svg>