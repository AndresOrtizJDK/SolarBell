<rect x="30" y="250" width="620" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="46" y="276" text-anchor="start" font-size="14" fill="#111" font-weight="700">Notas de conexión</text>
<text x="46" y="302" text-anchor="start" font-size="12" fill="#111">1. Ajusta el LM2596 a 5,0 V SIN carga (multímetro en OUT+/OUT−) antes de conectar el ESP32.</text>
<text x="46" y="324" text-anchor="start" font-size="12" fill="#111">2. El DS3231 se alimenta del pin 3V3 del ESP32 (no de 5 V): así SDA y SCL</text>
<text x="46" y="346" text-anchor="start" font-size="12" fill="#111">    quedan a 3,3 V. El módulo trae resistencias pull-up hacia VCC.</text>
<text x="46" y="368" text-anchor="start" font-size="12" fill="#111">3. Firmware: descomentar  #define USAR_DS3231 1  (SDA = GPIO21, SCL = GPIO22).</text>
<text x="46" y="390" text-anchor="start" font-size="12" fill="#111">4. Pila del DS3231: usa LIR2032 (recargable). Si usas CR2032, quita el diodo o la</text>
<text x="46" y="412" text-anchor="start" font-size="12" fill="#111">    resistencia de carga del módulo.</text>
<text x="46" y="434" text-anchor="start" font-size="12" fill="#111">5. Relé: VCC y GND a 5 V / GND. IN al GPIO26. Si el relé actúa al revés, descomenta</text>
<text x="46" y="456" text-anchor="start" font-size="12" fill="#111">    RELE_ACTIVO_EN_BAJO en configuracion.h.</text>
<text x="46" y="478" text-anchor="start" font-size="12" fill="#111">6. LED con 1 kΩ desde 5 V ≈ 3 mA (tenue pero visible). Con 330 Ω ≈ 9 mA.</text>
<text x="46" y="500" text-anchor="start" font-size="12" fill="#111">7. Todas las tierras unidas: batería, LM2596, ESP32, DS3231, relé y LED.</text>
<text x="46" y="522" text-anchor="start" font-size="12" fill="#111">8. Sube el firmware por USB con la batería desconectada; nunca USB y VIN a la vez.</text>
<text x="46" y="544" text-anchor="start" font-size="12" fill="#111">9. El inversor NO va en este circuito: cuando se conecte, va directo a la batería</text>
<text x="46" y="566" text-anchor="start" font-size="12" fill="#111">    con fusible (el LOAD del controlador solo soporta 10 A).</text>
<text x="46" y="588" text-anchor="start" font-size="12" fill="#111">10. Etapa final: sustituir el LED por los contactos COM/NO del relé en la línea de</text>
<text x="46" y="610" text-anchor="start" font-size="12" fill="#111">    110 VAC de la campana, solo cuando se confirme el circuito original y con la</text>
<text x="46" y="632" text-anchor="start" font-size="12" fill="#111">    parte de red en caja cerrada.</text>
<text x="46" y="650" text-anchor="start" font-size="12" fill="#111" font-weight="700">Colores:</text>
<rect x="100" y="644" width="22" height="5" fill="#dc2626"/>
<text x="128" y="650" text-anchor="start" font-size="12" fill="#111">12 V</text>
<rect x="172" y="644" width="22" height="5" fill="#ea580c"/>
<text x="200" y="650" text-anchor="start" font-size="12" fill="#111">5 V</text>
<rect x="244" y="644" width="22" height="5" fill="#111827"/>
<text x="272" y="650" text-anchor="start" font-size="12" fill="#111">GND</text>
<rect x="316" y="644" width="22" height="5" fill="#0d9488"/>
<text x="344" y="650" text-anchor="start" font-size="12" fill="#111">3,3 V</text>
<rect x="388" y="644" width="22" height="5" fill="#2563eb"/>
<text x="416" y="650" text-anchor="start" font-size="12" fill="#111">SDA</text>
<rect x="460" y="644" width="22" height="5" fill="#7c3aed"/>
<text x="488" y="650" text-anchor="start" font-size="12" fill="#111">SCL</text>
<rect x="46" y="658" width="22" height="5" fill="#d97706"/>
<text x="74" y="664" text-anchor="start" font-size="12" fill="#111">GPIO27 (interruptor Wi-Fi)</text>
<rect x="532" y="644" width="22" height="5" fill="#16a34a"/>
<text x="560" y="650" text-anchor="start" font-size="12" fill="#111">GPIO26</text>
<text x="46" y="684" text-anchor="start" font-size="12" fill="#111" font-weight="700">11. Interruptor del Wi-Fi: entre GPIO27 y GND (2 terminales, sin 5 V ni 12 V).</text>
<text x="46" y="702" text-anchor="start" font-size="11" fill="#111">Cerrado (I) = Wi-Fi apagado; abierto (O) o sin cable = encendido. El horario sigue sonando.</text>
</svg>