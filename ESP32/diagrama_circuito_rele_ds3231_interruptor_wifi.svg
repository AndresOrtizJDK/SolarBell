<text x="30" y="34" text-anchor="start" font-size="20" fill="#111" font-weight="700">SolarBell · Circuito con relé azul, reloj DS3231 e interruptor de Wi-Fi (etapa de prueba con LED)</text>
<text x="30" y="58" text-anchor="start" font-size="12" fill="#555">Batería → controlador → interruptor/fusible → LM2596 (5,0 V) → ESP32 + DS3231 + relé → LED. Las líneas que se cruzan sin punto NO están conectadas.</text>
