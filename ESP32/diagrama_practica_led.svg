<text x="46" y="883" text-anchor="start" font-size="12" fill="#111">1. LM2596 a 5,0 V SIN carga antes del ESP32. Nunca USB y batería a la vez.</text>
<text x="46" y="903" text-anchor="start" font-size="12" fill="#111">2. GND: todos los cables negros son la misma tierra (OUT− del LM2596).</text>
<text x="46" y="923" text-anchor="start" font-size="12" fill="#111">3. R2: COM a 5 V; NO → 330 Ω → pata larga del LED; pata corta a GND.</text>
<text x="46" y="943" text-anchor="start" font-size="12" fill="#111">4. LED con 330 Ω a 5 V ≈ 9 mA: brilla bien. Si no enciende, gira el LED.</text>
<text x="46" y="963" text-anchor="start" font-size="12" fill="#111">5. R1 (Songle): sin inversor solo hace clic, 2 s antes de cada toque.</text>
<text x="700" y="883" text-anchor="start" font-size="12" fill="#111">6. Sin campana: R2 cierra y el LED enciende mientras dura cada toque.</text>
<text x="700" y="903" text-anchor="start" font-size="12" fill="#111">7. DS3231 desde 3V3 (SDA = D21, SCL = D22). Interruptor Wi-Fi: cerrado = apagado.</text>
<text x="700" y="923" text-anchor="start" font-size="12" fill="#111">8. Sin interruptor ni fusibles: se apaga todo desde LOAD del controlador.</text>
<text x="700" y="943" text-anchor="start" font-size="12" fill="#111">9. Sin 110 VAC en esta práctica. La campana real: diagrama_completo_solarbell.svg.</text>
<text x="700" y="963" text-anchor="start" font-size="12" fill="#111">10. Sube el firmware por USB con la batería desconectada.</text>
<circle cx="620" cy="780" r="5" fill="#111827"/>
</svg>