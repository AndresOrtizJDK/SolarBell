<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="Arial, Helvetica, sans-serif">
<rect width="700" height="300" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="700" fill="#111">Prueba rápida de un LED</text>
<text x="24" y="56" font-size="12" fill="#555">La resistencia va en serie. Sin ella el LED se quema.</text>
<text x="40" y="128" font-size="13" font-weight="700" fill="#dc2626">(+) positivo</text>
<text x="40" y="238" font-size="13" font-weight="700" fill="#111">(−) negativo</text>
<path d="M40 140 H200" stroke="#dc2626" stroke-width="3" fill="none"/>
<rect x="200" y="125" width="110" height="30" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="255" y="145" text-anchor="middle" font-size="12" fill="#111">330 Ω / 1 kΩ</text>
<path d="M310 140 H470" stroke="#dc2626" stroke-width="3" fill="none"/>
<polygon points="470,110 470,170 520,140" fill="#fff" stroke="#111" stroke-width="2"/>
<line x1="520" y1="108" x2="520" y2="172" stroke="#111" stroke-width="2"/>
<text x="440" y="106" font-size="11" fill="#dc2626">pata larga (ánodo)</text>
<text x="500" y="196" font-size="11" fill="#111">pata corta (cátodo)</text>
<path d="M520 140 H600 V250 H40" stroke="#111827" stroke-width="3" fill="none"/>
<text x="24" y="282" font-size="12" fill="#555">5 V: 330 Ω (brillante) o 1 kΩ (tenue) · 12 V: 1 kΩ · Si no enciende, gira el LED.</text>
</svg>
