<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#1f2937">SolarBell · Prueba rápida sin relé: batería → controlador → LM2596 → ESP32</text>
  <text x="30" y="58" font-size="12" fill="#6b7280">El LED azul integrado del ESP32 (GPIO2) simula cada toque de la campana.</text>

  <!-- Panel solar (opcional) -->
  <rect x="30" y="100" width="130" height="90" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="95" y="130" font-size="14" font-weight="700" text-anchor="middle" fill="#713f12">Panel solar</text>
  <text x="95" y="149" font-size="11" text-anchor="middle" fill="#713f12">Powest 30 Wp</text>
  <text x="95" y="170" font-size="10" text-anchor="middle" fill="#713f12">(opcional en la prueba)</text>
  <path d="M160 130 H230" stroke="#dc2626" stroke-width="3" fill="none"/>
  <path d="M160 160 H230" stroke="#111827" stroke-width="3" fill="none"/>

  <!-- Controlador PWM -->
  <rect x="230" y="80" width="170" height="260" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="315" y="108" font-size="14" font-weight="700" text-anchor="middle" fill="#312e81">Controlador PWM</text>
  <text x="315" y="126" font-size="11" text-anchor="middle" fill="#312e81">10 A · 12 V</text>
  <text x="240" y="134" font-size="10" fill="#312e81">PV +</text>
  <text x="240" y="164" font-size="10" fill="#312e81">PV −</text>
  <text x="390" y="194" font-size="10" text-anchor="end" fill="#312e81">LOAD +</text>
  <text x="390" y="234" font-size="10" text-anchor="end" fill="#312e81">LOAD −</text>
  <text x="240" y="326" font-size="10" fill="#312e81">BAT +</text>
  <text x="390" y="326" font-size="10" text-anchor="end" fill="#312e81">BAT −</text>
  <text x="315" y="300" font-size="10" text-anchor="middle" fill="#6b7280">salida regulada</text>

  <!-- Batería -->
  <path d="M270 340 V400" stroke="#dc2626" stroke-width="3" fill="none"/>
  <path d="M330 340 V400" stroke="#111827" stroke-width="3" fill="none"/>
  <rect x="230" y="400" width="170" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="315" y="428" font-size="14" font-weight="700" text-anchor="middle" fill="#78350f">Batería 12 V</text>
  <text x="315" y="448" font-size="11" text-anchor="middle" fill="#78350f">FuliBattery FL1275GS</text>
  <text x="315" y="464" font-size="11" text-anchor="middle" fill="#78350f">7,5 Ah</text>

  <!-- LOAD → interruptor → LM2596 -->
  <path d="M400 190 H440" stroke="#dc2626" stroke-width="3" fill="none"/>
  <rect x="440" y="176" width="70" height="28" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="475" y="194" font-size="10" text-anchor="middle" fill="#991b1b">Interruptor</text>
  <text x="475" y="220" font-size="9" text-anchor="middle" fill="#6b7280">(+ fusible 2 A)</text>
  <path d="M510 190 H560" stroke="#dc2626" stroke-width="3" fill="none"/>
  <path d="M400 230 H560" stroke="#111827" stroke-width="3" fill="none"/>

  <!-- LM2596 -->
  <rect x="560" y="160" width="140" height="110" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="630" y="184" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">LM2596 (buck)</text>
  <text x="630" y="205" font-size="11" text-anchor="middle" fill="#1e3a8a">Salida ajustada</text>
  <text x="630" y="221" font-size="11" text-anchor="middle" fill="#1e3a8a">a 5,0 V</text>
  <text x="568" y="260" font-size="9" fill="#1e3a8a">IN+ / IN−</text>
  <text x="692" y="260" font-size="9" text-anchor="end" fill="#1e3a8a">OUT+ / OUT−</text>

  <!-- LM2596 → ESP32 -->
  <path d="M700 190 H770" stroke="#ea580c" stroke-width="3" fill="none"/>
  <path d="M700 230 H770" stroke="#111827" stroke-width="3" fill="none"/>

  <!-- ESP32 -->
  <rect x="770" y="140" width="170" height="160" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="855" y="166" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">ESP32 DevKit v1</text>
  <text x="780" y="194" font-size="10" fill="#14532d">VIN 5 V</text>
  <text x="780" y="234" font-size="10" fill="#14532d">GND</text>
  <circle cx="800" cy="272" r="9" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
  <text x="818" y="270" font-size="10" fill="#14532d">LED azul integrado</text>
  <text x="818" y="284" font-size="10" fill="#14532d">(GPIO2 · simula el toque)</text>

  <!-- Leyenda -->
  <g font-size="11" fill="#374151" transform="translate(0,120)">
    <rect x="30" y="330" width="14" height="4" fill="#dc2626"/><text x="52" y="337">12 V: batería → controlador → interruptor</text>
    <rect x="30" y="352" width="14" height="4" fill="#ea580c"/><text x="52" y="359">5 V (salida del LM2596)</text>
    <rect x="30" y="374" width="14" height="4" fill="#111827"/><text x="52" y="381">GND común</text>
  </g>
</svg>
