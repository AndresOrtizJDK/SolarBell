# Producción: `docker compose up -d --build`. Variables en `.env` (copiar de `.env.example`).
name: solarbell

services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solarbell}
      POSTGRES_USER: ${POSTGRES_USER:-solarbell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-solarbell}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-solarbell}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      TZ: ${TZ:-America/Bogota}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Falta ADMIN_EMAIL en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      DEVICE_NAME: ${DEVICE_NAME:-Campana}
      DEVICE_API_KEY: ${DEVICE_API_KEY:?Falta DEVICE_API_KEY en .env}
      RING_PAUSE_MS: ${RING_PAUSE_MS:-1000}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  pgdata:
