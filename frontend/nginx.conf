map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# IP del cliente, no la del proxy. Cloudflare manda la real en CF-Connecting-IP;
# si no hay ese header, el par TCP de nginx es el cliente. No se reenvía
# X-Forwarded-For tal cual: el cliente puede anteponer una IP falsa y uvicorn,
# con forwarded-allow-ips=*, se queda con la primera.
map $http_cf_connecting_ip $client_ip {
    ''      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App (/ws/app) y nodo ESP32 (/ws/device).
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
